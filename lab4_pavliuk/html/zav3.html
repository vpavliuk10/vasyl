<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання №3</title>
    <style>
         .pos-container { border: 2px dashed #333; padding: 20px; margin-top: 20px; position: relative; height: 350px; background: white; }
        .box { width: 80px; height: 80px; color: white; text-align: center; padding: 5px; font-size: 10pt; }
        .st { background: gray; position: static; } 
        .rel { background: blue; position: relative; top: 15px; left: 40px; } 
        .abs { background: red; position: absolute; bottom: 10px; right: 10px; } 
        .fix { background: purple; position: fixed; top: 10px; right: 10px; width: 60px; z-index: 1000; padding: 5px; border: 2px dashed white; color: white; font-size: 9pt; }

        .float-box { float: left; width: 120px; height: 60px; background: orange; margin: 10px; border: 2px solid black; }
        .clear-box { clear: both; background: lightblue; padding: 10px; border: 1px solid blue; }
        .z-wrap { position: relative; height: 150px; margin-top: 20px; }
        .z-item { position: absolute; width: 100px; height: 100px; border: 2px solid black; text-align: center; line-height: 100px; }
        .z1 { background: yellow; top: 0; left: 0; z-index: 1; }
        .z2 { background: cyan; top: 20px; left: 20px; z-index: 3; }
        .z3 { background: magenta; top: 40px; left: 40px; z-index: 2; }
        body {background-color:#CC99FF}
    </style>
</head>
<body>
    <a style="display: block; text-align: left" href="../lab4.html">На головну</a>
   <div style="margin-top: 50px; background: white; padding: 20px; border: 3px double black; position: relative;">
        <h2>Завдання 3: Position, Float, Clear, Z-index</h2>
        <div class="box fix">Fixed (я завжди в кутку)</div>
        
        <div class="pos-container">
            <div class="box st">Static</div>
            <div class="box rel">Relative</div>
            <div class="box abs">Absolute</div>
        </div>

        <div style="margin-top:20px;">
            <div class="float-box">Float</div>
            <p>Цей текст обтікає блок.</p>
            <div class="clear-box">Clear: block (скидання)</div>
        </div>

        <div class="z-wrap">
            <div class="z-item z1">Z1</div>
            <div class="z-item z3">Z2</div>
            <div class="z-item z2">Z3 (Top)</div>
        </div>
    </div> 
</body>
</html>
